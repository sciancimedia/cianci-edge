name: Build Cianci Edge (Android)
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Gradle 9.2.1 lo instala la acción oficial y queda CACHEADO entre
      # corridas (~/.gradle completo: distribución + dependencias).
      # Así la compilación NO depende de descargar el wrapper en cada
      # corrida, que es donde los 504 de esta noche mataron las 1-9.
      - name: Set up Gradle 9.2.1 (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build release APK
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            if gradle assembleRelease --stacktrace; then ok=1; break; fi
            echo "Build attempt $i failed (often a transient download 504); retrying in 90s..."
            sleep 90
          done
          if [ "$ok" != "1" ]; then echo "Build failed after 6 attempts"; exit 1; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cianci-edge-apk
          path: app/build/outputs/apk/release/*.apk
