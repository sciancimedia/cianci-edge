name: Build Cianci Edge (Android)
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleRelease --stacktrace; then ok=1; break; fi
            echo "Build attempt $i failed (often a transient download 504); retrying in 20s..."
            sleep 20
          done
          if [ "$ok" != "1" ]; then echo "Build failed after 3 attempts"; exit 1; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cianci-edge-apk
          path: app/build/outputs/apk/release/*.apk
