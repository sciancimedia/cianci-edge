name: Build Cianci Edge (Android)
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Gradle 9.2.1 viene DENTRO del repo (tools/gradle-dist/, en 3 partes
      # verificadas por sha256): las corridas 1-10 murieron bajándolo
      # (HTTP 504 de los proxies). Aquí no se descarga ningún instalador.
      - name: Assemble Gradle 9.2.1 from repo
        run: |
          cat tools/gradle-dist/gradle-9.2.1-bin.zip.part-* > /tmp/gradle-9.2.1-bin.zip
          cp tools/gradle-dist/gradle-9.2.1-bin.zip.sha256 /tmp/
          cd /tmp
          sha256sum -c gradle-9.2.1-bin.zip.sha256
          unzip -q gradle-9.2.1-bin.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.2.1/bin" >> "$GITHUB_PATH"
      - name: Build release APK
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            if gradle assembleRelease --stacktrace; then ok=1; break; fi
            echo "Build attempt $i failed (often a transient download 504); retrying in 90s..."
            sleep 90
          done
          if [ "$ok" != "1" ]; then echo "Build failed after 6 attempts"; exit 1; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cianci-edge-apk
          path: app/build/outputs/apk/release/*.apk
